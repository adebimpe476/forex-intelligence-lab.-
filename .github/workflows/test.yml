name: Research unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package
        run: pip install -e '.[dev]'
      - name: Verify no-lookahead and data integrity
        run: pytest -q
# No scheduled broker connection or live-trading credentials in CI.
