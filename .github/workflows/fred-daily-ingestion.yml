name: FRED access terms review — extraction disabled
# FRED's published terms restrict development/training of AI systems using
# FRED Content. No automated FRED fetch in this repository until use is
# independently reviewed, appropriately licensed, and explicitly reauthorized.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terms-review:
    runs-on: ubuntu-latest
    steps:
      - name: Report disabled reference-data extraction
        run: |
          echo 'FRED extraction is paused pending source-rights review.'
          echo 'See https://fred.stlouisfed.org/legal/'
          echo 'AI/model training on FRED Content is NOT enabled.'
          echo 'Use rights-reviewed source manifests for future market datasets.'
