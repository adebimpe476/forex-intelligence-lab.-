[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-intelligence-lab"
version = "0.3.0"
description = "Research-only forex tick QA, multi-timeframe strategy hypotheses and edge audit"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.28", "fastapi>=0.100", "uvicorn>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ml = ["scikit-learn>=1.3"]

[project.scripts]
forexlab = "forexlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
